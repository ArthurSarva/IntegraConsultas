name: Database foundation
on:
  pull_request:
  push:
    branches: [main, 008-base-supabase]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:test
      - run: pnpm typecheck
      - name: Start disposable local Supabase
        run: pnpm db:start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - run: pnpm db:reset
      - run: pnpm db:test:supabase
      - run: pnpm db:lint
      - run: pnpm db:advisors
      - name: Prepare disposable web identities
        run: node scripts/prepare-web-tests.mjs
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Start guarded local administrator function
        run: node scripts/start-test-functions.mjs
      - name: Validate web flows and real sessions
        run: pnpm test:web
      - name: Validate invite reading with development Strict Mode
        run: pnpm test:invite:dev
      - if: always()
        run: pnpm db:stop
